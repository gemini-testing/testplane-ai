name: release-please

on:
    push:
        branches:
            - master
    workflow_dispatch:

jobs:
    release-please:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            cli_release_created: ${{ steps.release.outputs['packages/cli--release_created'] }}
            mcp_release_created: ${{ steps.release.outputs['packages/mcp--release_created'] }}
        steps:
            - uses: actions/checkout@v6
              if: ${{ github.event_name == 'push' }}
              with:
                  fetch-depth: 0

            - name: Tag internal tools version
              if: ${{ github.event_name == 'push' }}
              env:
                  BEFORE_SHA: ${{ github.event.before }}
                  CURRENT_SHA: ${{ github.sha }}
              run: |
                  previous_version="$(git show "${BEFORE_SHA}:.release-please-manifest.json" | jq -r '.["packages/tools"] // empty')"
                  current_version="$(jq -r '.["packages/tools"] // empty' .release-please-manifest.json)"

                  if [[ -z "${previous_version}" || -z "${current_version}" || "${current_version}" == "${previous_version}" ]]; then
                      exit 0
                  fi

                  tag="tools-v${current_version}"
                  if git rev-parse --quiet --verify "refs/tags/${tag}"; then
                      exit 0
                  fi

                  git tag "${tag}" "${CURRENT_SHA}"
                  git push origin "refs/tags/${tag}"

            - uses: googleapis/release-please-action@v5
              if: ${{ github.event_name == 'push' }}
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish-mcp:
        needs: release-please
        if: ${{ github.event_name == 'workflow_dispatch' || needs.release-please.outputs.mcp_release_created == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.sha }}

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false

            - run: npm ci

            - run: npm run build --workspace @testplane/mcp

            - run: npm publish --workspace @testplane/mcp --access public

    publish-cli:
        needs: release-please
        if: ${{ github.event_name == 'workflow_dispatch' || needs.release-please.outputs.cli_release_created == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.sha }}

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false

            - run: npm ci

            - run: npm run build --workspace @testplane/cli

            - run: npm publish --workspace @testplane/cli --access public
