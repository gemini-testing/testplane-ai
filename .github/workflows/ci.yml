name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Run tests on Node.js ${{ matrix.node-version }}
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22, 24]
            fail-fast: false

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"

            - name: Cache Testplane browsers
              uses: actions/cache@v5
              with:
                  path: ~/.testplane
                  key: ${{ runner.os }}-testplane-${{ matrix.browser }}
                  restore-keys: |
                      ${{ runner.os }}-testplane-${{ matrix.browser }}-
                      ${{ runner.os }}-testplane-

            - name: Install dependencies
              run: npm ci

            - name: Run build
              run: npm run build

            - name: Preload browser
              env:
                  DISABLE_BROWSER_SANDBOX: true
              run: |
                  timeout 90s npm run ci:preload-browser || echo "Browser setup completed"

            - name: Run tests
              env:
                  DISABLE_BROWSER_SANDBOX: true
              run: npm test
